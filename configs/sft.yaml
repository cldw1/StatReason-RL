{
  "extends": "model.yaml",
  "experiment": {"name": "sft_smoke", "stage": "sft", "level": 0, "status": "planned"},
  "sft": {"assistant_only_loss": true, "max_length": 384, "packing": false, "max_train_examples": 32, "max_validation_examples": 16},
  "paths": {"dataset_release": "data/processed/statreason-v1"},
  "resources": {"max_train_seconds": 180},
  "trainer": {
    "learning_rate": 0.0001, "per_device_train_batch_size": 1,
    "gradient_accumulation_steps": 4, "max_steps": 4,
    "bf16": true, "fp16": false, "gradient_checkpointing": true,
    "gradient_checkpointing_kwargs": {"use_reentrant": false},
    "optim": "adamw_torch", "weight_decay": 0.0, "max_grad_norm": 1.0,
    "lr_scheduler_type": "constant", "warmup_steps": 0,
    "logging_steps": 1, "save_steps": 2, "save_total_limit": 2,
    "eval_strategy": "no", "report_to": ["tensorboard"],
    "dataloader_num_workers": 0, "remove_unused_columns": false
  }
}
